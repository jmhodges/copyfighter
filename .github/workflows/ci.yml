name: CI

on:
  push:
    branches: [master]
  pull_request:
  # copyfighter type checks packages from their compiled export data, so it
  # tends to break when a new Go toolchain ships rather than when this repo
  # changes. Build it on a schedule to catch that before a user does.
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest toolchain go.mod allows, plus the current release.
        go-version: ['1.25.x', 'stable']
    name: test (go ${{ matrix.go-version }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race -v ./...
